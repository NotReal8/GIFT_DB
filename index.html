<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GIFT Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ── Auth overlay ─────────────────────────────────────── -->
  <div id="auth-overlay" class="auth-overlay hidden">
    <div class="auth-box">
      <div class="auth-logo">
        <img src="assets/logo.svg" alt="GIFT" class="auth-logo-img" />
        <span class="auth-logo-text">GIFT</span>
      </div>
      <h2 id="auth-title">Sign In</h2>
      <p class="auth-sub" id="auth-sub">Enter your credentials to access the dashboard.</p>

      <!-- Sign In Form -->
      <div id="signin-form">
        <div class="field">
          <label>Organization ID</label>
          <input type="text" id="si-org" placeholder="e.g. SpringfieldHS" autocomplete="organization" />
        </div>
        <div class="field">
          <label>Username</label>
          <input type="text" id="si-user" placeholder="e.g. Mr. Smith" autocomplete="username" />
        </div>
        <div class="field">
          <label>Password</label>
          <div class="pw-wrap">
            <input type="password" id="si-pass" placeholder="••••••••" autocomplete="current-password" />
            <button class="pw-toggle" onclick="togglePw('si-pass',this)">👁</button>
          </div>
        </div>
        <div id="si-error" class="auth-error hidden"></div>
        <button class="btn-primary" id="si-btn" onclick="handleSignIn()">Enter Dashboard</button>
        <p class="auth-switch">No account? <a href="#" onclick="showRegister()">Register</a></p>
      </div>

      <!-- Register Form -->
      <div id="register-form" class="hidden">
        <div class="field">
          <label>Organization ID</label>
          <input type="text" id="reg-org" placeholder="e.g. SpringfieldHS" />
        </div>
        <div class="field">
          <label>Username</label>
          <input type="text" id="reg-user" placeholder="e.g. Mr. Smith" />
        </div>
        <div class="field">
          <label>Password</label>
          <div class="pw-wrap">
            <input type="password" id="reg-pass" placeholder="••••••••" />
            <button class="pw-toggle" onclick="togglePw('reg-pass',this)">👁</button>
          </div>
        </div>
        <div class="field">
          <label>Role</label>
          <select id="reg-role">
            <option value="Teacher">Teacher</option>
            <option value="HR">HR / Admin</option>
          </select>
        </div>
        <div id="reg-error" class="auth-error hidden"></div>
        <button class="btn-primary" id="reg-btn" onclick="handleRegister()">Create Account</button>
        <p class="auth-switch">Have an account? <a href="#" onclick="showSignIn()">Sign In</a></p>
      </div>
    </div>
  </div>

  <!-- ── Main app shell ──────────────────────────────────── -->
  <div id="app" class="app hidden">

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar collapsed">
      <div class="sidebar-header">
        <img src="assets/logo.svg" alt="GIFT" class="sidebar-logo" />
        <span class="sidebar-brand">GIFT</span>
        <button class="sidebar-close" onclick="toggleSidebar()">✕</button>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-page="home" onclick="navigateTo('home',this)">
          <span class="nav-icon">⬛</span><span class="nav-label">Overview</span>
        </a>
        <a href="#" class="nav-item" data-page="audit" onclick="navigateTo('audit',this)">
          <span class="nav-icon">◈</span><span class="nav-label">Audit Analytics</span>
        </a>
        <a href="#" class="nav-item" data-page="attendance" onclick="navigateTo('attendance',this)">
          <span class="nav-icon">◎</span><span class="nav-label">Attendance Records</span>
        </a>
        <a href="#" class="nav-item" data-page="teacher-roster" onclick="navigateTo('teacher-roster',this)">
          <span class="nav-icon">◻</span><span class="nav-label">Teacher Roster</span>
        </a>
        <a href="#" class="nav-item" data-page="student-roster" onclick="navigateTo('student-roster',this)">
          <span class="nav-icon">◽</span><span class="nav-label">Student Roster</span>
        </a>
        <a href="#" class="nav-item" data-page="killswitch" onclick="navigateTo('killswitch',this)">
          <span class="nav-icon">⬡</span><span class="nav-label">Kill Switch</span>
        </a>
        <a href="#" class="nav-item" data-page="profile" onclick="navigateTo('profile',this)">
          <span class="nav-icon">◯</span><span class="nav-label">Profile</span>
        </a>
        <a href="#" class="nav-item" data-page="settings" onclick="navigateTo('settings',this)">
          <span class="nav-icon">⊕</span><span class="nav-label">Settings</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn-signout" onclick="signOut()">Sign Out</button>
      </div>
    </aside>

    <!-- Top bar -->
    <header class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()">
        <span></span><span></span><span></span>
      </button>
      <h1 class="topbar-title">GIFT Dashboard</h1>
      <div class="topbar-right">
        <span class="topbar-user" id="topbar-user">—</span>
        <span class="status-dot" id="status-dot"></span>
      </div>
    </header>

    <!-- Page container -->
    <main id="page-container" class="page-container">
      <!-- Pages injected by JS -->
    </main>

  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <!-- App scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/audit.js"></script>
  <script src="js/pages/attendance.js"></script>
  <script src="js/pages/teacher-roster.js"></script>
  <script src="js/pages/student-roster.js"></script>
  <script src="js/pages/killswitch.js"></script>
  <script src="js/pages/profile.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
