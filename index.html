<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GIFT Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ── Auth ──────────────────────────────────────────────── -->
  <div id="auth-overlay" class="auth-overlay hidden">
    <div class="auth-box">
      <div class="auth-logo">
        <img src="assets/logo.svg" alt="GIFT" class="auth-logo-img" />
        <span class="auth-logo-text">GIFT</span>
      </div>
      <h2>Sign In</h2>
      <p class="auth-sub">Enter your credentials to access the dashboard.</p>
      <div class="field">
        <label>Organization ID</label>
        <input type="text" id="si-org" placeholder="e.g. SpringfieldHS" autocomplete="organization" />
      </div>
      <div class="field">
        <label>Username</label>
        <input type="text" id="si-user" placeholder="e.g. Mr. Smith" autocomplete="username" />
      </div>
      <div class="field">
        <label>Password</label>
        <div class="pw-wrap">
          <input type="password" id="si-pass" placeholder="••••••••" autocomplete="current-password" />
          <button class="pw-toggle" onclick="togglePw('si-pass',this)">👁</button>
        </div>
      </div>
      <div class="field">
        <label>Role</label>
        <select id="si-role">
          <option value="Teacher">Teacher</option>
          <option value="HR">HR / Admin</option>
        </select>
      </div>
      <div id="si-error" class="auth-error hidden"></div>
      <button class="btn-primary" id="si-btn" onclick="handleSignIn()">Enter Dashboard</button>
    </div>
  </div>

  <!-- ── App ───────────────────────────────────────────────── -->
  <div id="app" class="app hidden">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <img src="assets/logo.svg" alt="GIFT" class="sidebar-logo" />
        <span class="sidebar-brand">GIFT</span>
        <button class="sidebar-close" onclick="toggleSidebar()">✕</button>
      </div>
      <nav class="sidebar-nav">
        <div class="sidebar-section-label">Main</div>
        <a href="#" class="nav-item active" data-page="home"           onclick="navigateTo('home',this)">          <span class="nav-icon">🏠</span> Overview</a>
        <a href="#" class="nav-item"         data-page="audit"          onclick="navigateTo('audit',this)">         <span class="nav-icon">📋</span> Audit Analytics</a>
        <a href="#" class="nav-item"         data-page="attendance"     onclick="navigateTo('attendance',this)">    <span class="nav-icon">📅</span> Attendance Records</a>
        <div class="sidebar-section-label">People</div>
        <a href="#" class="nav-item"         data-page="teacher-roster" onclick="navigateTo('teacher-roster',this)"><span class="nav-icon">👨‍🏫</span> Teacher Roster</a>
        <a href="#" class="nav-item"         data-page="student-roster" onclick="navigateTo('student-roster',this)"><span class="nav-icon">🎓</span> Student Roster</a>
        <div class="sidebar-section-label">Control</div>
        <a href="#" class="nav-item"         data-page="killswitch"     onclick="navigateTo('killswitch',this)">    <span class="nav-icon">⚡</span> Kill Switch<span id="kill-badge" class="nav-badge hidden">!</span></a>
        <a href="#" class="nav-item"         data-page="pending-requests" onclick="navigateTo('pending-requests',this)"><span class="nav-icon">📥</span> Pending Requests<span id="pending-badge" class="nav-badge hidden">!</span></a>
        <a href="#" class="nav-item"         data-page="profile"        onclick="navigateTo('profile',this)">       <span class="nav-icon">👤</span> Profile</a>
        <a href="#" class="nav-item"         data-page="settings"       onclick="navigateTo('settings',this)">      <span class="nav-icon">⚙️</span> Settings</a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn-signout" onclick="signOut()">Sign Out</button>
      </div>
    </aside>

    <header class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()">
        <span></span><span></span><span></span>
      </button>
      <h1 class="topbar-title">GIFT Dashboard</h1>
      <div class="topbar-right">
        <span class="topbar-user" id="topbar-user">—</span>
        <span class="topbar-role" id="topbar-role">—</span>
        <span class="status-dot"></span>
      </div>
    </header>

    <main id="page-container" class="page-container"></main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/audit.js"></script>
  <script src="js/pages/attendance.js"></script>
  <script src="js/pages/teacher-roster.js"></script>
  <script src="js/pages/student-roster.js"></script>
  <script src="js/pages/killswitch.js"></script>
  <script src="js/pages/pending-requests.js"></script>
  <script src="js/pages/profile.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
